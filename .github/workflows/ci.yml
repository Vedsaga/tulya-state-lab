name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select stable Rust
        run: rustup default stable
      - name: Test
        run: cargo test --all-targets
      - name: Smoke benchmark
        run: cargo run --release -- --branches 128 --base-kib 256 --verify-samples 12
