name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select stable Rust
        run: rustup default stable
      - name: Test
        run: cargo test --all-targets
      - name: Check trace preparer syntax
        run: python3 -m py_compile scripts/prepare_swebench_verified.py
      - name: Check benchmark syntax
        run: python3 -m py_compile benchmarks/langgraph/bench_postgres.py benchmarks/langgraph/bench_postgres_fixed.py benchmarks/storage_floor/bench_corpus.py
      - name: Smoke real corpus mode
        run: |
          mkdir -p target/corpus-smoke
          printf 'alpha OLD tail' > target/corpus-smoke/base.bin
          printf 'alpha NEW longer tail' > target/corpus-smoke/child.bin
          printf 'smoke\tbase.bin\tchild.bin\n' > target/corpus-smoke/manifest.tsv
          cargo run --release -- --corpus-manifest target/corpus-smoke/manifest.tsv --verify-samples 2
      - name: Smoke small-edit
        run: cargo run --release -- --workload small-edit --branches 32 --base-kib 64 --edit-bytes 64 --verify-samples 8
      - name: Smoke append-heavy
        run: cargo run --release -- --workload append-heavy --branches 32 --base-kib 64 --edit-bytes 256 --verify-samples 8
      - name: Smoke cross-template
        run: cargo run --release -- --workload cross-template --branches 24 --base-kib 64 --edit-bytes 4096 --verify-samples 8
      - name: Smoke large-rewrite
        run: cargo run --release -- --workload large-rewrite --branches 24 --base-kib 128 --edit-bytes 4096 --verify-samples 8
